[project]
name = "vibrantic-agentic-chatbot"
version = "0.1.0"
description = "Enterprise AI Agent SaaS Platform"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "loguru>=0.7.3",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

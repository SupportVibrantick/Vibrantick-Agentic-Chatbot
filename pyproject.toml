[project]
name = "vibrantic-agentic-chatbot"
version = "0.1.0"
description = "Enterprise AI Agent SaaS Platform"
requires-python = ">=3.12"

dependencies = [
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi",
    "loguru>=0.7.3",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

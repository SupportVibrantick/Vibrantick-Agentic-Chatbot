[project]
name = "vibrantic-agentic-chatbot"
version = "0.1.0"
description = "Enterprise AI Agent SaaS Platform"
requires-python = ">=3.12"

dependencies = [
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "email-validator>=2.3.0",
    "faker>=40.28.1",
    "fastapi",
    "fastapi-mail>=1.6.5",
    "jinja2>=3.1.6",
    "langchain-text-splitters>=1.1.2",
    "loguru>=0.7.3",
    "markdown>=3.10.3",
    "openai>=2.46.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.2",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sentence-transformers>=5.7.0",
    "sqlalchemy>=2.0.51",
    "tiktoken>=0.13.0",
    "uvicorn[standard]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
